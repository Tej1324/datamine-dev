<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ground-floor GPU detector</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui; background: #0d131c; color: #edf4ff }
    body { margin: 0 }
    main { max-width: 1280px; margin: auto; padding: 24px }
    h1 { margin: 0 0 5px }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0 12px }
    button { border: 1px solid #4d6b8e; border-radius: 6px; background: #172235; color: #edf4ff; padding: 8px 12px; cursor: pointer }
    button.active { background: #1f77c8; border-color: #5eaaf1 }
    button:disabled { opacity: .45; cursor: not-allowed }
    .toolbar-label { color: #9eb1c9; font-size: 13px; margin-right: 2px }
    .stage { aspect-ratio: 1280 / 736; background: #000; border: 1px solid #2d405a; border-radius: 8px; overflow: hidden; position: relative }
    #dashboard { width: 100%; line-height: 0 }
    #dashboard-grid { display: grid; width: 100%; height: 100%; gap: 0; background: #000 }
    .camera-tile { min-width: 0; position: relative; background: #000; overflow: hidden }
    .camera-tile img { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
    #reid-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
    .reid-label { position: absolute; border: 2px solid #00e5ff; color: #00e5ff; font: 700 13px system-ui; line-height: 1; }
    .reid-label.pending { border-color: #fbbf24; color: #fbbf24; }
    .reid-label.unknown { border-color: #94a3b8; color: #e2e8f0; }
    .reid-label span { position: absolute; top: -20px; left: -2px; padding: 3px 5px; background: rgba(0,25,35,.88); white-space: nowrap }
    .camera-tile h2 { position: absolute; z-index: 1; left: 10px; top: 8px; margin: 0; padding: 4px 8px; background: rgba(0,0,0,.65); font-size: 16px; line-height: 1.2 }
    .stats { margin-top: 12px; padding: 12px; background: #172235; border-radius: 8px }
    .row { display: grid; grid-template-columns: 1.5fr repeat(3,1fr); gap: 8px; padding: 7px 0; border-bottom: 1px solid #2d3c52 }
    .head { font-size: 12px; color: #9eb1c9; text-transform: uppercase }
    #status { color: #9eb1c9 }
  </style>
</head>
<body>
  <main>
    <h1>Ground-floor GPU detector</h1>
    <p>Six NVIDIA DeepStream cameras · native 1280×720 camera streams · per-camera GPU OSD · NvDCF/Re-ID local tracking</p>
    <div class="toolbar">
      <button id="fullscreen">FULLSCREEN</button>
    </div>
    <section class="stage" id="dashboard">
      <div id="dashboard-grid" aria-label="Live camera dashboard"></div>
    </section>
    <section class="stats">
      <div class="row head"><span>Camera</span><span>Detector FPS</span><span>Persons</span><span>Frame age</span></div>
      <div id="rows"></div>
      <p id="system">System: CPU — · GPU — · VRAM — · NVDEC — · NVENC —</p>
      <p id="status">Connecting to NVIDIA GPU JPEG overview…</p>
    </section>
  </main>
  <script>
    const cameras = [
      { id: 'ground_01', label: 'CH7' },
      { id: 'ground_02', label: 'CH16' },
      { id: 'ground_03', label: 'CH10' },
      { id: 'ground_04', label: 'CH18' },
      { id: 'ground_05', label: 'CH20' },
      { id: 'ground_06', label: 'CH11' }
    ];
    const grid = document.querySelector('#dashboard-grid');
    let selectedTile = cameras[0].id;
    let renderedKey = '';

    document.querySelector('#rows').innerHTML = cameras.map(camera =>
      '<div class="row"><span>' + camera.id + ' (' + camera.label + ')</span><span id="' + camera.id + '-fps">—</span><span id="' + camera.id + '-count">—</span><span id="' + camera.id + '-age">—</span></div>'
    ).join('');

    function renderDashboard() {
      if (renderedKey) return;
      renderedKey = 'overview';
      grid.style.gridTemplateColumns = '1fr';
      const tile = document.createElement('div');
      tile.className = 'camera-tile';
      tile.dataset.camera = 'overview';
      tile.innerHTML = '<img id="overview-image" alt="Six-camera DeepStream live overview"><div id="reid-overlay" aria-label="Experimental SOLIDER Re-ID labels"></div>';
      grid.replaceChildren(tile);
      document.querySelector('#status').textContent = 'Live NVIDIA GPU JPEG overview connecting';
    }

    document.querySelector('#fullscreen').addEventListener('click', async () => {
      const tile = document.querySelector('.camera-tile[data-camera="' + selectedTile + '"]') || document.querySelector('.camera-tile');
      if (!tile) return;
      if (!document.fullscreenElement) await tile.requestFullscreen();
      else await document.exitFullscreen();
    });

    async function refresh() {
      try {
        const response = await fetch('/api/system/metrics', { cache: 'no-store' });
        const metrics = await response.json();
        document.querySelector('#system').textContent = 'CPU ' + (metrics.cpu_percent ?? '—') + '% · GPU ' + (metrics.gpu_percent ?? '—') + '% · VRAM ' + (metrics.vram_used_mib ?? '—') + '/' + (metrics.vram_total_mib ?? '—') + ' MiB · NVDEC ' + (metrics.nvdec_percent ?? '—') + '% · NVENC ' + (metrics.nvenc_percent ?? '—') + '%';
      } catch (error) {}
      setTimeout(refresh, 1000);
    }

    let previousOverviewUrl = null;
    async function refreshOverview() {
      try {
        // Fetch one snapshot at a time. If the browser or SSH tunnel is slow,
        // the next request still receives the newest frame rather than a
        // backlog of old MJPEG frames.
        const response = await fetch('/api/overview/frame?ts=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('overview unavailable');
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const image = document.querySelector('#overview-image');
        if (image) image.src = url;
        if (previousOverviewUrl) URL.revokeObjectURL(previousOverviewUrl);
        previousOverviewUrl = url;
        document.querySelector('#status').textContent = 'Live NVIDIA GPU JPEG overview connected';
      } catch (error) {
        document.querySelector('#status').textContent = 'Waiting for live overview…';
      }
      setTimeout(refreshOverview, 100);
    }

    async function refreshExperimentalReid() {
      try {
        const response = await fetch('/api/reid-experiment/latest?ts=' + Date.now(), { cache: 'no-store' });
        const state = await response.json();
        const overlay = document.querySelector('#reid-overlay');
        const image = document.querySelector('#overview-image');
        if (!overlay || !image || !state.enabled || !image.clientWidth) return;
        overlay.replaceChildren();
        if (state.overlay_in_video) {
          document.querySelector('#status').textContent = 'SOLIDER live · E… ? = unconfirmed · SOL-E… = associated';
          return;
        }
        const scaleX = image.clientWidth / 1280;
        const renderedHeight = image.clientWidth * 360 / 1280;
        const letterboxTop = Math.max(0, (image.clientHeight - renderedHeight) / 2);
        let confirmed = 0;
        let provisional = 0;
        let pending = 0;
        for (const track of state.tracks || []) {
          if (!track.bbox) continue;
          const [left, top, width, height] = track.bbox;
          const el = document.createElement('div');
          const hasId = track.experimental_global_id !== null && track.experimental_global_id !== undefined;
          const isConfirmed = Boolean(track.cross_camera_confirmed || track.identity_status === 'GLOBAL_CONFIRMED');
          el.className = 'reid-label ' + (isConfirmed ? 'confirmed' : hasId ? 'pending' : 'unknown');
          el.style.left = ((track.source_id * 640 + left * 0.5) * scaleX) + 'px';
          el.style.top = (letterboxTop + (top * 0.5) * scaleX) + 'px';
          el.style.width = Math.max(10, width * 0.5 * scaleX) + 'px';
          el.style.height = Math.max(10, height * 0.5 * scaleX) + 'px';
          let label;
          if (isConfirmed) {
            confirmed += 1;
            label = 'SOL-E' + track.experimental_global_id;
          } else if (hasId) {
            provisional += 1;
            label = 'PENDING-E' + track.experimental_global_id;
          } else {
            pending += 1;
            label = 'L' + track.local_track_id + ' · UNKNOWN';
          }
          el.innerHTML = '<span>' + label + '</span>';
          overlay.appendChild(el);
        }
        const stats = state.stats || {};
        if (state.enabled) document.querySelector('#status').textContent =
          'Live overview · visible: ' + (state.tracks || []).length +
          ' · confirmed: ' + confirmed + ' · provisional: ' + provisional +
          ' · unknown/pending: ' + pending +
          ' · cross-camera matches: ' + (stats.cross_camera_match || 0);
      } catch (error) {} finally {
        setTimeout(refreshExperimentalReid, 250);
      }
    }

    renderDashboard();
    refresh();
    refreshOverview();
    refreshExperimentalReid();
  </script>
</body>
</html>
