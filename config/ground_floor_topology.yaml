# Read-only visual topology survey.  No camera credentials, URLs, poses,
# calibration matrices, homographies, or travel times are stored here.
schema: ground-floor-topology-survey-v1
survey:
  method: one full-resolution representative frame per requested channel
  requested_channels: [7, 10, 11, 16, 18, 20]
  runtime_config_file: config/cameras.yaml
  runtime_config_note: >-
    The active application camera set is now channels 7, 10, 11, 16, 18, and 20.
    Channel 11 is the sixth production source; its floor topology remains unknown.

runtime_source_mapping:
  - channel: 7
    runtime_source_id: 0
    status: active
  - channel: 10
    runtime_source_id: 2
    status: active
  - channel: 16
    runtime_source_id: 1
    status: active
  - channel: 18
    runtime_source_id: 3
    status: active
  - channel: 20
    runtime_source_id: 4
    status: active
  - channel: 11
    runtime_source_id: 5
    status: active

cameras:
  - camera: ch07
    channel: 7
    runtime_source_id: 0
    visible_floor_region: entrance stair landing, threshold, and immediate doorway area
    useful_walking_regions:
      - stair landing
      - entrance threshold
      - right-side doorway edge
    blind_or_dead_regions:
      - interior beyond the right-side partition
      - area behind the left foreground partition
    fixed_landmarks:
      - entrance stairs and handrails
      - central stanchion post
      - blue floor mat and blue guide line
      - decorated entrance pillars
      - CP IP Cam watermark
    boundaries:
      - exterior-to-store entrance threshold
      - stair-to-landing boundary
    candidate_entry_zones:
      - entrance threshold
    candidate_exit_zones:
      - entrance threshold
    overlap_observation: no shared interior floor area verified from the surveyed frames
    unknowns:
      - exact overlap with interior cameras
      - direction of travel through the threshold
      - normalized zone coordinates

  - camera: ch10
    channel: 10
    runtime_source_id: 2
    visible_floor_region: front interior sales floor with central display tables
    useful_walking_regions:
      - open central aisle
      - left-side queue/rope area
      - far entrance-side walkway
      - right-side table perimeter
    blind_or_dead_regions:
      - behind central display tables
      - left room beyond the wall/partition
      - right edge behind the large foreground display
    fixed_landmarks:
      - red queue ropes and stanchions
      - central folded-cloth display tables
      - digital prints sign
      - far entrance-side bright opening
      - CP IP Cam watermark
    boundaries:
      - far entrance-side opening
      - queue-rope boundary
      - display-table aisle boundaries
    candidate_entry_zones:
      - far entrance-side opening
      - left queue-rope opening
    candidate_exit_zones:
      - far entrance-side opening
      - left queue-rope opening
    overlap_observation: no pairwise overlap verified from fixed landmarks alone
    unknowns:
      - whether the far bright opening is the same threshold seen by ch07
      - overlap with ch16, ch18, or ch20
      - normalized zone coordinates

  - camera: ch16
    channel: 16
    runtime_source_id: 1
    status: active
    visible_floor_region: central sales floor with a large foreground display and right wall
    useful_walking_regions:
      - open central aisle
      - left-side aisle beside folded-cloth tables
      - right-side wall aisle
      - rear counter walkway
    blind_or_dead_regions:
      - behind the large foreground display
      - far left behind stacked displays
      - lower-right corner near the foreground person
    fixed_landmarks:
      - KISAN digital display on the right wall
      - central large folded-cloth display
      - rear wall counters
      - left catalog sign
      - CP IP Cam watermark
    boundaries:
      - right wall/counter edge
      - central display-table aisle boundaries
      - rear counter line
    candidate_entry_zones:
      - left-side aisle opening
      - rear counter walkway
    candidate_exit_zones:
      - right wall aisle
      - left-side aisle opening
    overlap_observation: shares the KISAN display/right-wall area and central display geometry with ch18
    overlap_cameras:
      - camera: ch18
        confidence: high
        evidence: common KISAN display/right-wall landmark and matching central display area
      - camera: ch20
        confidence: candidate
        evidence: similar central display and right-wall sales-floor geometry, not uniquely confirmed
    unknowns:
      - source stream timestamps for synchronized multi-camera calibration
      - overlap with ch10
      - exact boundary of shared area
      - normalized zone coordinates

  - camera: ch18
    channel: 18
    runtime_source_id: 3
    visible_floor_region: broad central store aisle with multiple folded-cloth islands
    useful_walking_regions:
      - central aisle
      - left folded-cloth aisle
      - right wall aisle
      - far entrance-side aisle
    blind_or_dead_regions:
      - behind folded-cloth islands
      - far-left edge behind shelving
      - lower-right edge outside the frame
    fixed_landmarks:
      - KISAN digital display on the right wall
      - central folded-cloth islands
      - blouse-work sarees sign
      - catalog sign on the left
      - CP IP Cam watermark
    boundaries:
      - right wall/counter edge
      - central display-table aisle boundaries
      - far entrance-side opening
    candidate_entry_zones:
      - far entrance-side opening
      - left central aisle
    candidate_exit_zones:
      - right wall aisle
      - left central aisle
    overlap_observation: shares the KISAN display/right-wall area and central display geometry with ch16
    overlap_cameras:
      - camera: ch16
        confidence: high
        evidence: common KISAN display/right-wall landmark and matching central display area
      - camera: ch20
        confidence: candidate
        evidence: similar store-floor islands and right-wall geometry, not uniquely confirmed
    unknowns:
      - overlap with ch10
      - exact shared-area boundary with ch16/ch20
      - normalized zone coordinates

  - camera: ch20
    channel: 20
    runtime_source_id: 4
    visible_floor_region: wide sales floor with foreground clothing racks and central islands
    useful_walking_regions:
      - central open aisle
      - left rack aisle
      - right customer walkway
      - rear wall aisle
    blind_or_dead_regions:
      - behind foreground racks
      - behind central folded-cloth islands
      - extreme lower foreground
    fixed_landmarks:
      - foreground clothing-rack island
      - central folded-cloth display islands
      - rear wall shelving
      - right-side customer walkway
      - CP IP Cam watermark
    boundaries:
      - foreground rack edges
      - central display-table aisle boundaries
      - rear wall/counter line
    candidate_entry_zones:
      - left rack aisle
      - rear wall aisle
    candidate_exit_zones:
      - right customer walkway
      - left rack aisle
    overlap_observation: no uniquely identifiable shared landmark was sufficient to verify an overlap
    overlap_cameras:
      - camera: ch16
        confidence: candidate
        evidence: similar central display and right-wall sales-floor geometry
      - camera: ch18
        confidence: candidate
        evidence: similar store-floor islands and right-wall geometry
    unknowns:
      - whether the similar displays are the same physical fixtures
      - exact overlap with ch16/ch18
      - normalized zone coordinates

verified_overlaps:
  - cameras: [ch16, ch18]
    confidence: high
    shared_landmarks:
      - KISAN digital display/right-wall section
      - central folded-cloth display area
    status: visually_verified_from_representative_frames

candidate_non_overlapping_handoff_routes:
  - cameras: [ch07, ch10]
    status: candidate_only
    reason: ch07 shows the threshold/stair side while ch10 shows an interior sales-floor side; a continuous route is plausible, but a shared floor region is not verified
  - cameras: [ch10, ch18]
    status: unknown
    reason: both show interior sales areas, but no unique common landmark was confirmed
  - cameras: [ch18, ch20]
    status: unknown
    reason: similar store fixtures are visible, but the shared physical area is not uniquely confirmed

calibration:
  homography: not_generated
  camera_poses: unknown
  ground_plane: unknown
  travel_times: unknown
  normalized_zone_coordinates: unknown

required_physical_measurements:
  - provide a floor plan or hand sketch with camera positions and viewing directions
  - photograph each shared landmark from both camera viewpoints
  - record exact pixel coordinates of common landmarks in each camera frame
  - measure walking-path distances between confirmed handoff boundaries
  - record minimum, typical, and maximum walking times for each confirmed route
  - record direction of travel at each entry and exit boundary
  - perform synchronized or timestamped walk-through video for overlap confirmation

automagiccalib_readiness: blocked_on_real_inputs
automagiccalib_reason: >-
  Main-stream calibration footage and a floor-plan/layout image are not yet
  present. No calibration values have been invented.
