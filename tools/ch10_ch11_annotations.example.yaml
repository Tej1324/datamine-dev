# Copy this file to a new annotation file and add one entry per manually
# verified pair. Do not edit the example in place.
#
# id_type: global means the labels visible on the dashboard, e.g. G67.
# id_type: local means NvTracker IDs from the diagnostic JSONL log.
# timestamp_ns or frame/frame_a/frame_b is optional for global-ID screenshots,
# but strongly recommended so the evaluator can verify the recorded event.

annotations:
  - reference_id: person_001
    same_person: true
    source_a: 0       # left / CH10
    id_a: G67
    source_b: 1       # right / CH11
    id_b: G4
    id_type: global
    # timestamp_ns: 1790674259612033000
    # tolerance_seconds: 2

  # Add hard negative examples too: two different people that must not share
  # a Global ID. This is required to measure false merges.
  - reference_id: negative_001
    same_person: false
    source_a: 0
    id_a: G67
    source_b: 1
    id_b: G23
    id_type: global

  # For a local-track annotation, use local IDs and a timestamp/frame:
  # - reference_id: person_002
  #   same_person: true
  #   source_a: 0
  #   id_a: 131
  #   source_b: 1
  #   id_b: 87
  #   id_type: local
  #   timestamp_ns: 1790674259612033000
