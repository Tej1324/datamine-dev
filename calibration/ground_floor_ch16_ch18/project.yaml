project: ground_floor_ch16_ch18
purpose: automagiccalib_input_manifest
status: waiting_for_automagiccalib_runtime_and_alignment

# Calibration-only streams. Production remains subtype 1 at 1280x720.
cameras:
  - id: ch16
    channel: 16
    runtime_source_id: 1
    stream: main
    subtype: 0
    width: 1920
    height: 1080
    fps: 15
    codec: hevc
    input_video: inputs/videos/ch16.mp4
  - id: ch18
    channel: 18
    runtime_source_id: 3
    stream: main
    subtype: 0
    width: 1920
    height: 1080
    fps: 15
    codec: hevc
    input_video: inputs/videos/ch18.mp4

layout_image: inputs/layout.png
output_directory: outputs/automagiccalib
mv3dt_output_directory: outputs/mv3dt

capture:
  method: simultaneous_ffmpeg_stream_copy
  started_utc: '2026-09-17T09:57:38.720465+00:00'
  ended_utc: '2026-09-17T10:02:42.281908+00:00'
  requested_duration_seconds: 300
  actual_duration_seconds:
    ch16: 299.999667
    ch18: 299.999667
  synchronization:
    launch_mode: concurrent_processes
    exact_per_camera_start_skew: unknown
  verification: both files are HEVC stream copies from the NVR main streams

automagiccalib:
  status: ready_for_alignment
  executable_or_container: nvcr.io/nvidia/auto-magic-calib:3.2.1
  inputs_ready: false
  runtime_storage: /opt/dlami/nvme/datamine-amc-root
  service_project_id: '20260917_033514_6940'
  service_project_state: READY
  uploaded_video_order: [ch16, ch18]
  uploaded_video_names: [cam_00.mp4, cam_01.mp4]
  layout_uploaded: true
  alignment_uploaded: false
  calibration_started: false
  required_before_run:
    - real multi-camera camera-to-layout alignment with at least 4 point sets
    - layout pixels per meter in the AMC settings

alignment_schema:
  filename: alignment_data.json
  format: json_array
  camera_order: [ch16, ch18]
  minimum_point_sets: 4
  recommended_point_sets: 6
  point_set_shape: [[ch16_x, ch16_y], [ch18_x, ch18_y], [layout_x, layout_y]]
  camera_coordinate_space: original_1920x1080_frame_pixels
  layout_coordinate_space: inputs/layout.png_pixels
  upload_endpoint: /v1/upload_alignment/{project_id}
  layout_scale_setting: layout_px_per_m
  status: waiting_for_real_coordinates

# Must be selected by the real calibration run; no distortion values are
# assumed here. If rectification is enabled, production frames must be
# rectified into the same coordinate space before MV3DT consumes them.
rectification: unknown
projection_matrices: not_generated
